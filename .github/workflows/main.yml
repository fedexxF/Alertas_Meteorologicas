name: Chequeo de Alertas SMN

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install requests shapely
      - name: Ejecutar script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python script.py
      - name: Guardar memoria del bot
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'action@github.com'
          git add memoria_bot.txt
          git commit -m "Actualizar memoria de alertas enviadas" || echo "No hay alertas nuevas para guardar"
          git push
