name: Bot Clima Varela

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el bot de clima
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOKEN_RADAR: ${{ secrets.TELEGRAM_TOKEN_RADAR }}
          CHAT_ID_RADAR: ${{ secrets.CHAT_ID_RADAR }}
        run: python src/main.py

      - name: Guardar memoria (Commit y Push automático)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/memoria_bot.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Memoria actualizada por el bot" && git push)
