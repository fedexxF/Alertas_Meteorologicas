name: Bot Clima Varela

on:
  schedule:
    # Se ejecuta cada 5 minutos. 
    # (Nota: GitHub a veces tiene un poco de demora en sus servidores gratuitos, puede tardar 6 o 7 min)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Este botón te permite correrlo manualmente desde la pestaña "Actions"

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Una versión estable y rápida

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el bot de clima
        env:
          # Llama a las variables secretas que configuraste en los Settings de tu repo
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python src/main.py

      - name: Guardar memoria (Commit y Push automático)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Le decimos que preste atención a la nueva ruta de la memoria
          git add data/memoria_bot.txt
          
          # Solo hace un commit si el archivo de memoria realmente cambió
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Memoria actualizada por el bot" && git push)
